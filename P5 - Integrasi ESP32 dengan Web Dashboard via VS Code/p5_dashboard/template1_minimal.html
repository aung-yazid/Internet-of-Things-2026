<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Laporan Ruangan</title>
    <style>
      :root {
        --paper: #f0ebe0;
        --ink: #1f1b16;
        --muted: #8b8271;
        --line: #cdc3b0;
        --accent: #b3462a;
        --serif:
          "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--serif);
      }
      /* tekstur kertas halus */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.07;
        background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
      }
      /* cahaya hangat saat lampu menyala */
      .glow {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0;
        transition: opacity 1.2s;
        background: radial-gradient(
          ellipse at 88% 8%,
          rgba(245, 205, 120, 0.55),
          transparent 60%
        );
      }
      .glow.on {
        opacity: 1;
      }

      .sheet {
        position: relative;
        max-width: 1000px;
        margin: 0 auto;
        padding: 44px 32px 36px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 16px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--ink);
        flex-wrap: wrap;
      }
      .kicker {
        font-family: var(--sans);
        font-size: 0.72rem;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }
      .meta {
        font-family: var(--sans);
        font-size: 0.78rem;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--line);
      }
      .dot.ok {
        background: #4c8a5a;
      }
      .dot.bad {
        background: var(--accent);
      }

      main {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        gap: 72px;
        margin-top: 48px;
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
          gap: 36px;
        }
      }

      .label {
        font-family: var(--sans);
        font-size: 0.7rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .temp {
        font-size: clamp(6.5rem, 18vw, 12rem);
        line-height: 0.9;
        letter-spacing: -0.045em;
        margin: 14px 0 6px;
        font-weight: 400;
      }
      .temp sup {
        font-size: 0.2em;
        vertical-align: top;
        position: relative;
        top: 0.5em;
        margin-left: 6px;
        color: var(--accent);
        letter-spacing: 0;
      }
      .feel {
        font-style: italic;
        font-size: 1.6rem;
        color: var(--accent);
      }

      aside .row {
        border-top: 1px solid var(--line);
        padding: 22px 0 26px;
      }
      aside .row:last-child {
        border-bottom: 1px solid var(--line);
      }
      .num {
        font-size: 2.6rem;
        margin: 8px 0 12px;
        line-height: 1;
      }
      .num small {
        font-size: 1rem;
        color: var(--muted);
        margin-left: 4px;
      }
      .rule {
        height: 2px;
        background: var(--line);
      }
      .rule i {
        display: block;
        height: 100%;
        width: 0;
        background: var(--ink);
        transition: width 0.9s ease;
      }

      .link {
        background: none;
        border: 0;
        padding: 0 0 3px;
        cursor: pointer;
        color: var(--ink);
        font: italic 1.15rem var(--serif);
        border-bottom: 1px solid var(--ink);
        transition:
          color 0.2s,
          border-color 0.2s;
      }
      .link:hover {
        color: var(--accent);
        border-color: var(--accent);
      }

      footer {
        margin-top: 56px;
        font-family: var(--sans);
        font-size: 0.72rem;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
    </style>
  </head>
  <body>
    <div class="glow" id="glow"></div>
    <div class="sheet">
      <header>
        <div class="kicker">Laporan Ruangan</div>
        <div class="meta">
          <span id="dateNow"></span> &nbsp;·&nbsp;
          <span class="dot" id="dot"></span
          ><span id="status">Menghubungkan</span>
        </div>
      </header>

      <main>
        <section id="cardTemp">
          <div class="label">Suhu udara</div>
          <div class="temp"><span id="temp">--</span><sup>°C</sup></div>
          <div class="feel" id="feel">menunggu data</div>
        </section>

        <aside>
          <div class="row">
            <div class="label">Kelembapan</div>
            <div class="num"><span id="hum">--</span><small>%</small></div>
            <div class="rule"><i id="humBar"></i></div>
          </div>
          <div class="row">
            <div class="label">Lampu</div>
            <div class="num" id="ledText">--</div>
            <button class="link" id="btnLed" onclick="toggleLed()">
              Nyalakan →
            </button>
          </div>
        </aside>
      </main>

      <footer>
        ESP32 &nbsp;/&nbsp; DHT11 &nbsp;/&nbsp; diperbarui
        <span id="updated">--:--:--</span>
      </footer>
    </div>

    <script src="config.js"></script>
    <script>
      let ledOn = false;
      const $ = (id) => document.getElementById(id);

      $("dateNow").textContent = new Date().toLocaleDateString("id-ID", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
      });

      // GET /api/sensor
      async function getSensor() {
        try {
          const res = await fetch(API_BASE + "/api/sensor");
          const data = await res.json();
          showData(data);
          setStatus(true);
        } catch (err) {
          console.error(err);
          setStatus(false);
        }
      }

      // GET /api/led?state=0|1
      async function setLed(state) {
        try {
          const res = await fetch(API_BASE + "/api/led?state=" + state);
          const data = await res.json();
          showData({ led: data.led });
        } catch (err) {
          console.error(err);
        }
      }

      function toggleLed() {
        setLed(ledOn ? 0 : 1);
      }

      function setStatus(ok) {
        $("dot").className = "dot " + (ok ? "ok" : "bad");
        $("status").textContent = ok
          ? "Terhubung"
          : "Terputus (cek IP di config.js dan Console F12)";
        if (ok)
          $("updated").textContent = new Date().toLocaleTimeString("id-ID");
      }

      function showData(d) {
        if (d.temp !== undefined) {
          $("temp").textContent = d.temp ?? "--";
          if (d.temp !== null)
            $("feel").textContent =
              d.temp < 25
                ? "terasa sejuk"
                : d.temp < 30
                  ? "terasa hangat"
                  : "terasa panas";
        }
        if (d.hum !== undefined) {
          $("hum").textContent = d.hum ?? "--";
          $("humBar").style.width = (d.hum ?? 0) + "%";
        }
        if (d.led !== undefined) {
          ledOn = d.led === 1;
          $("ledText").textContent = ledOn ? "Menyala" : "Padam";
          $("btnLed").textContent = ledOn ? "Padamkan →" : "Nyalakan →";
          $("glow").classList.toggle("on", ledOn);
        }
      }

      getSensor();
      setInterval(getSensor, POLL_INTERVAL);
    </script>
  </body>
</html>
